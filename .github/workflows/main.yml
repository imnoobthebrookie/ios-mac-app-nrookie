name: Build IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Pods
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Set Default Scheme & Build Unsigned
        run: |
          # Tự động tìm tên workspace hoặc project
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            filetype_parameter="workspace" 
            file_to_build="`ls -A | grep -i \\.xcworkspace\$`"
          else 
            filetype_parameter="project" 
            file_to_build="`ls -A | grep -i \\.xcodeproj\$`"
          fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          
          # Lấy scheme đầu tiên tìm thấy
          scheme_list=$(xcodebuild -"$filetype_parameter" "$file_to_build" -list -json | tr -d "\n")
          scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['workspace']['schemes'][0]" 2>/dev/null || echo "ProtonVPN")
          if [ -z "$scheme" ] || [ "$scheme" = "nil" ]; then
            scheme="ProtonVPN"
          fi
          echo "Using scheme: $scheme"

          # Tiến hành build bản phát hành cho iPhone thật (unsigned)
          xcodebuild -"$filetype_parameter" "$file_to_build" \
                     -scheme "$scheme" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     build

      - name: Create IPA file
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStoreApp
          path: app.ipa
