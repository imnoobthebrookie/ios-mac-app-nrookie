name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Project
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App (Simulator / Unsigned)
        run: |
          # Tìm file .xcodeproj hoặc .xcworkspace trong repo và thay tên vào đây nếu cần
          project_file=$(ls -d *.xcodeproj | head -n 1)
          scheme_name=$(basename "$project_file" .xcodeproj)
          
          echo "Building project: $project_file with scheme: $scheme_name"
          
          xcodebuild -project "$project_file" \
                     -scheme "$scheme_name" \
                     -sdk iphonesimulator \
                     -configuration Release \
                     build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
