name: Build IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Pods
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build ProtonVPN Clean Target
        run: |
          set -e
          
          # Tìm file workspace hoặc xcodeproj
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            BUILD_TYPE="-workspace"
            BUILD_FILE="`ls -A | grep -i \\.xcworkspace\$`"
          else 
            BUILD_TYPE="-project"
            BUILD_FILE="`ls -A | grep -i \\.xcodeproj\$`"
          fi
          BUILD_FILE=`echo $BUILD_FILE | awk '{$1=$1;print}'`
          
          echo "Building using $BUILD_TYPE: $BUILD_FILE"

          # Lấy chính xác scheme đầu tiên để build
          SCHEME=$(xcodebuild "$BUILD_TYPE" "$BUILD_FILE" -list -json | tr -d "\n" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['workspace']['schemes'][0]" 2>/dev/null || echo "ProtonVPN")
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "nil" ]; then
            SCHEME="ProtonVPN"
          fi
          echo "Target Scheme: $SCHEME"

          # Build ở chế độ sạch, bỏ qua các bước phân tích tĩnh gây lỗi exit code 74
          xcodebuild "$BUILD_TYPE" "$BUILD_FILE" \
                     -scheme "$SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     build

      - name: Create IPA file
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStoreApp
          path: app.ipa
